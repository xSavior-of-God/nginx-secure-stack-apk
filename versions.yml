# nginx-secure-stack-apk package versions
# Run: ./update-versions.sh [--dry-run]

alpine: "3.23.4"

packages:
  nginx:
    version: "1.30.4"
    github: "nginx/nginx"

  libmodsecurity:
    version: "3.0.16"
    github: "owasp-modsecurity/ModSecurity"

  modsecurity-nginx:
    version: "1.0.4"
    github: "owasp-modsecurity/ModSecurity-nginx"

  headers-more:
    version: "0.40"
    github: "openresty/headers-more-nginx-module"

  owasp-crs:
    version: "4.28.0"
    github: "coreruleset/coreruleset"

  geoip2:
    version: "3.4"
    github: "leev/ngx_http_geoip2_module"

  geoip-db:
    version: "2026.07"
    month: "2026-06"
